[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-inphic"
version = "0.5.0"
description = "Unofficial Linux settings and firmware upgrade tool for INPHIC 2.4G wireless mice"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
authors = [{ name = "Open INPHIC contributors" }]
keywords = ["inphic", "mouse", "hid", "hidraw", "linux", "firmware", "dpi", "2.4g"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Utilities",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/BruceZhang1993/open-inphic-driver"
Repository = "https://github.com/BruceZhang1993/open-inphic-driver"
Issues = "https://github.com/BruceZhang1993/open-inphic-driver/issues"
Documentation = "https://github.com/BruceZhang1993/open-inphic-driver#readme"

[project.scripts]
open-inphic = "open_inphic.hid:main"
open-inphic-gui = "open_inphic.gui:main"

[tool.setuptools]
packages = ["open_inphic"]

[tool.setuptools.package-data]
open_inphic = ["ui/*.qml"]

[tool.setuptools.data-files]
"share/open-inphic/udev" = ["udev/70-inphic-x9-pro.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
